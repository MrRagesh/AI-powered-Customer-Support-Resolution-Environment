version: "3.9"
services:
  api:
    build: .
    ports:
      - "7860:7860"
    env_file: .env
    volumes:
      - ./faiss_index:/app/faiss_index
      - ./support_env.db:/app/support_env.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
